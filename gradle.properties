# Non-secret build settings. Put niagara_home and signing passwords in
# local.properties (gitignored) or in the environment. See README.md.

org.gradle.jvmargs=-Xmx1g
org.gradle.java.installations.auto-detect=true

# Niagara 4.13+ Gradle plugin versions.
# These tools compile a module against a 4.13 or later niagara_home.
# If resolution fails, set gradlePluginVersion to the version directory under
# %NIAGARA_HOME%/etc/m2/repository/com/tridium/niagara-module/
gradlePluginVersion=7.6.22
settingsPluginVersion=7.6.3

# niagara_home=C:\\Niagara\\Niagara-4.15.6.20
# niagara_user_home=C:\\Users\\you\\Niagara\\tridium\\4.15.6.20
# gradlePluginHome=C:\\Niagara\\Niagara-4.15.6.20\\etc\\m2\\repository
# Java 8 toolchain used by the Niagara compile task. The 4.15.6.20 jre includes javac.
# org.gradle.java.installations.paths=C:\\Niagara\\Niagara-4.15.6.20\\jre
